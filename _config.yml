# Site settings

title: Il portfolio di Riccardo Scaringi
email: ricscar@gmail.com
description: >
  Portfolio tecnico di Riccardo Scaringi: software, cloud, data engineering,
  machine learning e case study, con stato e maturità dei progetti dichiarati in modo trasparente.

# A custom GitHub Pages domain is configured through CNAME, so the site is served
# from the domain root rather than from /portfolio.
baseurl: ""
url: "https://www.riccardoscaringi.eu"
github_username: ricscar2570

# Build settings
theme: minimal-mistakes-jekyll
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Historical project copies are intentionally retained in Git for provenance,
# but they are not part of the live portfolio site. Excluding them keeps Pages
# small and prevents old README/front-matter files from becoming unintended pages.
exclude:
  - "2Digit"
  - "AWS Energy Data Platform"
  - "AWSFriendlyCounsellor"
  - "Analisi Satellitare Terremoti"
  - "Disaster Recover Pipeline"
  - "Esercitazioni Sapienza"
  - "HealthSolver"
  - "Serverless Data Engineering Pipeline"
  - "SimplEcomm"
  - "Some of My Data"
  - "TornadoPredictor"
  - "checkFit"
  - "happyCustomer"
  - "myContinuousI&D"
  - "myDataExplored"
  - "myEcoomerce"
  - "securApp"
  - "thatsAllCloud"
  - "webProof"
